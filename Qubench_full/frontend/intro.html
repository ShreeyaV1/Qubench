<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qubench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Caslon+Text:wght@400;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --weather: #a1937e;      /* Weather Board */
    --derby: #594836;        /* Brown Derby */
    --maroon: #4d1519;       /* Maroon Oak */
    --seal: #301413;         /* Seal Brown */
    --soy: #170704;          /* Soy Sauce */
    --walnut: #302622;
    --walnut-deep: #1a1210;
    --oxblood: #67343a;
    --burgundy: #800020;
    --tobacco: #9a704f;
    --aged-paper: #d4be9d;
    --parchment: #ede2cf;
    --cream: #fff5e1;
    --paper: #f7ecd4;
    --ink: #3b0a12;
    --brass: #b38b3c;
    --cream-text: var(--parchment);
    --muted-text: var(--aged-paper);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background: radial-gradient(ellipse 70% 62% at 50% 42%, var(--maroon) 0%, var(--seal) 55%, var(--soy) 100%);
    color: var(--cream-text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  .viewport { position: fixed; inset: 0; display: grid; place-items: center; perspective: 1600px; }
  .stage { position: relative; width: 1000px; height: 700px; transform-origin: center; }
  .stage.tap { animation: tap 0.28s ease-out; }
  @keyframes tap { 0% { translate: 0 0; } 25% { translate: 0 1.6px; } 55% { translate: 0 -0.6px; } 100% { translate: 0 0; } }

  /* soft light pool on the "table" */
  .floor {
    position: absolute; left: 50%; top: 585px; width: 820px; height: 170px; translate: -50% 0;
    background: radial-gradient(ellipse at center, rgba(212, 190, 157, .16), transparent 68%);
  }

  /* ---------- Papers ---------- */
  .papers { position: absolute; inset: 0; z-index: 3; pointer-events: none; isolation: isolate; transform: translateZ(0); perspective: 1600px; }
  .paper {
    position: absolute; left: 0; top: 0; width: 152px; height: 197px;
    padding: 15px 15px 12px;
    border-radius: 1.5px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      linear-gradient(104deg, #fffaf0 0%, var(--paper) 26%, #ecdcc0 62%, #f7ecd4 86%, #dcc8a3 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 22px 34px -8px rgba(0, 0, 0, .5), 0 6px 10px rgba(0,0,0,.18);
    will-change: transform;
    color: var(--ink);
    font-family: "Libre Caslon Text", Georgia, serif;
    overflow: hidden;
  }
  .paper .court { font-size: 4.2px; letter-spacing: .14em; text-align: center; opacity: .75; }
  .paper h4 { font-size: 7.4px; font-weight: 700; letter-spacing: .06em; text-align: center; margin: 3px 0 7px; }
  .paper .rule { height: .6px; background: var(--ink); opacity: .45; margin: 0 0 7px; }
  .paper .line { height: 2px; background: var(--ink); opacity: .36; margin-bottom: 3.6px; border-radius: 1px; }
  .paper .gap { height: 4px; }
  .paper .q { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .paper .q .box { width: 4.5px; height: 4.5px; border: .6px solid var(--ink); opacity: .6; flex: none; }
  .paper .q .line { flex: 1; margin: 0; }
  .paper .row { display: flex; gap: 6px; margin-bottom: 4.2px; }
  .paper .row .line { margin: 0; }
  .paper .seal {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    border: 1.1px solid rgba(140, 40, 30, .55);
    box-shadow: 0 0 0 1.6px rgba(140,40,30,.18) inset;
  }
  .paper .stamp {
    position: absolute; right: 12px; bottom: 30px; padding: 2px 4px; rotate: -12deg;
    font: 700 5px/1 "Libre Caslon Text", serif; letter-spacing: .12em;
    color: rgba(150, 40, 30, .6); border: .8px solid rgba(150, 40, 30, .5);
  }
  .paper svg.sig { position: absolute; left: 16px; bottom: 13px; width: 52px; height: 16px; }
  .paper .sigline { position: absolute; left: 15px; bottom: 12px; width: 56px; height: .6px; background: var(--ink); opacity: .5; }

  /* ---------- Block, gavel, effects ---------- */
  .block { position: absolute; z-index: 2; left: 500px; top: 548px; translate: -50% 0; width: 300px; height: 110px; }
  .block svg, .gavel svg { width: 100%; height: 100%; overflow: visible; }
  .contact {
    position: absolute; z-index: 2; left: 500px; top: 566px; width: 120px; height: 18px; translate: -50% -50%;
    border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
    opacity: .15; scale: 1.6; transition: opacity .5s ease, scale .5s ease;
  }
  .contact.near { opacity: .7; scale: 1; transition: opacity .1s ease-in, scale .1s ease-in; }
  .ring {
    position: absolute; left: 500px; top: 566px; width: 210px; height: 36px; translate: -50% -50%;
    border: 1px solid rgba(237, 226, 207, .35); border-radius: 50%; opacity: 0;
  }
  .ring.go { animation: ring 0.8s ease-out forwards; }
  @keyframes ring { 0% { opacity: .6; } 100% { opacity: 0; width: 560px; height: 96px; } }

  .gavel {
    position: absolute; z-index: 2; width: 470px; height: 150px;
    left: 440px;  /* head centre (x=60) over block centre (500) */
    top: 438px;   /* head face (y=128) on block top (566) */
    transform-origin: 452px 78px;   /* wrist pivot at the end of the handle */
    rotate: 9deg;
    filter: drop-shadow(0 18px 14px rgba(0,0,0,.42));
  }
  .gavel.lift   { transition: rotate .5s cubic-bezier(.25,.6,.35,1); rotate: 15deg; }
  .gavel.strike { transition: rotate .11s cubic-bezier(.55,0,1,.5); rotate: 0deg; }
  .gavel.rebound{ transition: rotate .09s ease-out; rotate: 2.6deg; }
  .gavel.settle { transition: rotate .28s cubic-bezier(.4,0,.6,1); rotate: .6deg; }

  /* ---------- Gavel scene: slides down and out after the bang ---------- */
  .scene { position: absolute; inset: 0; z-index: 2; }
  .scene.exit { transform: translateY(860px); transition: transform 1.15s cubic-bezier(.55,0,.8,.3); }
  .scene.gone { transform: translateY(860px); transition: none; }

  /* ---------- Hero: QUBENCH behind the Parliament cut-out ---------- */
  .hero { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .hero .word {
    position: absolute; left: 0; right: 0; top: var(--ty, 25vh); text-align: center; white-space: nowrap;
    font-family: "Anton", "Impact", "Arial Narrow", sans-serif; font-weight: 400;
    font-size: var(--fs, 22vw); line-height: .86; letter-spacing: .005em; text-transform: uppercase;
    opacity: 0; translate: 0 4vh;
  }
  .hero .solid { color: var(--weather); }
  .hero .outline { color: transparent; -webkit-text-stroke: 2px var(--weather); z-index: 2; }
  .hero .parl {
    position: absolute; left: 50%; bottom: 0; width: var(--pw, 62vw); max-width: none; z-index: 1;
    transform: translate(-50%, 104%);
    filter: saturate(.9) contrast(1.04);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
  }
  .hero.show .word { opacity: 1; translate: 0 0; transition: opacity 1.1s ease, translate 1.3s cubic-bezier(.2,.75,.2,1); }
  .hero.rise .parl { transform: translate(-50%, 0); transition: transform 1.7s cubic-bezier(.16,.84,.24,1); }
  .hero .tag, .hero .tag-r { position: absolute; top: 4.5vh; font: 400 15px/1 "IBM Plex Sans", system-ui, sans-serif;
                              color: var(--weather); letter-spacing: .02em; opacity: 0; }
  .hero .tag { left: 4vw; } .hero .tag-r { right: 4vw; }
  .hero .band {
    position: absolute; right: -6vw; bottom: 6vh; width: 48vw; height: 62px; z-index: 3;
    background: var(--weather); rotate: -7deg; transform-origin: right center;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 9vw;
    color: var(--soy); text-decoration: none; font: 500 18px/1 "IBM Plex Sans", system-ui, sans-serif;
    translate: 60vw 0; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .hero .band:hover { background: #b3a58f; }
  .hero .replay { position: absolute; left: 4vw; bottom: 4vh; z-index: 3; opacity: 0; pointer-events: auto; }
  .hero.done .tag, .hero.done .tag-r, .hero.done .replay { opacity: 1; transition: opacity .8s ease; }
  .hero.done .band { translate: 0 0; transition: translate .9s cubic-bezier(.2,.8,.2,1); }
  .hero.instant *, .hero.instant { transition: none !important; }

  /* ---------- (legacy title, unused) ---------- */
  .title { position: absolute; z-index: 3; left: 0; right: 0; top: 118px; text-align: center; opacity: 0; translate: 0 12px; pointer-events: none; }
  .title.show { opacity: 1; translate: 0 0; transition: opacity 1.2s ease, translate 1.3s cubic-bezier(.2,.7,.2,1); pointer-events: auto; }
  .title h1 {
    font-family: "Anton", "Impact", "Arial Narrow", sans-serif;
    font-weight: 400; font-size: 168px; line-height: .9; letter-spacing: .012em;
    text-transform: uppercase; color: var(--parchment);
    text-shadow: 0 8px 34px rgba(0,0,0,.5);
  }
  .title p { margin: 22px auto 0; max-width: 34ch; font-size: 19px; line-height: 1.5; color: var(--muted-text); }
  .actions { margin-top: 34px; display: flex; gap: 22px; justify-content: center; align-items: center; }
  .btn {
    font: 500 17px/1 "IBM Plex Sans", system-ui, sans-serif; color: var(--cream);
    background: linear-gradient(180deg, #9b1d30, var(--burgundy)); padding: 15px 30px; border-radius: 3px;
    text-decoration: none; box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 24px rgba(0,0,0,.35);
    transition: filter .2s ease, translate .2s ease;
  }
  .btn:hover { filter: brightness(1.15); translate: 0 -1px; }
  .link { font: 400 15px/1 "IBM Plex Sans", system-ui, sans-serif; color: var(--muted-text); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  .link:hover { color: var(--cream-text); }
  .btn:focus-visible, .link:focus-visible, .skip:focus-visible { outline: 2px solid var(--cream-text); outline-offset: 4px; }
  .skip { position: fixed; right: 24px; bottom: 20px; z-index: 5; font: 400 14px/1 "IBM Plex Sans", system-ui, sans-serif; color: var(--muted-text); background: none; border: 0; cursor: pointer; opacity: .7; }
  .skip:hover { opacity: 1; }
  .skip.hidden { display: none; }
</style>
</head>

<script>
(() => {
  const stage = document.getElementById("stage");
  const gavel = document.getElementById("gavel");
  const contact = document.getElementById("contact");
  const papersEl = document.getElementById("papers");
  const hero = document.getElementById("hero");
  const scene = document.getElementById("scene");
  const skipBtn = document.getElementById("skip");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Where "Take the bench" goes. Change this to your app's link.
  document.getElementById("enter").href = "https://quantum-jury-fairness-lab.lovable.app/#bench";

  // Size QUBENCH to span ~92% of the screen width (capped by height), like the reference poster,
  // and size the Parliament so its tower rises into the lower half of the letters.
  function fitHero() {
    const probe = document.createElement("span");
    probe.textContent = "QUBENCH";
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:"Anton","Impact",sans-serif;font-size:100px;letter-spacing:.005em';
    document.body.appendChild(probe);
    const w100 = probe.getBoundingClientRect().width || 330;
    probe.remove();
    const fs = Math.min(innerWidth * 0.92 / (w100 / 100), innerHeight * 0.52);
    hero.style.setProperty("--fs", fs + "px");
    // Parliament: tall enough that the Peace Tower runs through the whole word and its tip peeks above
    const img = document.getElementById("parl");
    const ratio = (img.naturalWidth && img.naturalHeight) ? img.naturalHeight / img.naturalWidth : 0.62;
    const portrait = innerHeight > innerWidth * 1.2;
    const pw = portrait ? Math.min(innerWidth * 1.9, innerHeight * 0.6 / ratio)   // phones: crop wings off-screen
                        : Math.min(innerWidth * 0.96, innerHeight * 0.74 / ratio);
    hero.style.setProperty("--pw", pw + "px");
    const towerTop = innerHeight - pw * ratio;                // top of the roof
    const textH = fs * 0.86;
    hero.style.setProperty("--ty", Math.max(innerHeight * 0.1, towerTop - fs * 0.42) + "px");
  }
  window.addEventListener("resize", fitHero);
  document.getElementById("parl").addEventListener("load", fitHero);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitHero); fitHero();

  function fit() {
    const s = Math.min(window.innerWidth / 1000, window.innerHeight / 700) * 0.98;
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener("resize", fit); fit();

  // ---------- realistic document contents ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const line = (w) => `<div class="line" style="width:${w}%"></div>`;
  const para = (n, indent = true) => {
    let h = "";
    for (let i = 0; i < n; i++) {
      const last = i === n - 1;
      const w = last ? rnd(35, 75) : rnd(93, 100);
      h += `<div class="line" style="width:${w}%;${i === 0 && indent ? "margin-left:8%;width:" + (w - 8) + "%" : ""}"></div>`;
    }
    return h + '<div class="gap"></div>';
  };
  const sig = `<div class="sigline"></div><svg class="sig" viewBox="0 0 52 16"><path d="M2 12 C 6 2, 9 2, 9 9 C 9 14, 13 4, 16 7 C 18 9, 19 12, 22 8 C 25 3, 27 13, 31 9 C 34 6, 36 10, 40 7 C 43 5, 46 9, 50 6" fill="none" stroke="#24304a" stroke-width="1" stroke-linecap="round" opacity=".75"/></svg>`;
  const header = (t) => `<div class="court">ONTARIO SUPERIOR COURT OF JUSTICE</div><h4>${t}</h4><div class="rule"></div>`;

  const docs = [
    () => header("SUMMONS FOR JURY SERVICE") + para(4) + para(3) + para(2) + sig +
          `<div class="seal" style="right:13px;bottom:10px"></div>`,
    () => header("JUROR QUESTIONNAIRE") +
          Array.from({ length: 8 }, () => `<div class="q"><div class="box"></div>${line(rnd(60, 100))}</div>`).join("") + sig,
    () => header("ORDER OF THE COURT") + para(3) + para(4) + para(2) + `<div class="stamp">FILED</div>` + sig,
    () => header("JURY PANEL LIST") +
          Array.from({ length: 10 }, () => `<div class="row">${line(14)}${line(rnd(30, 44))}${line(rnd(18, 28))}</div>`).join(""),
    () => header("NOTICE TO JUROR") + para(3) + para(3) + para(3) + `<div class="seal" style="left:13px;top:12px"></div>`,
    () => header("VERDICT FORM") + para(2, false) +
          Array.from({ length: 5 }, () => `<div class="q"><div class="box"></div>${line(rnd(55, 85))}</div>`).join("") + sig,
  ];

  // Positions like the reference: [x, y, rotate, tiltY, tiltX]
  const layout = [
    [140, 250, -13, 16, 14], [285, 68, 11, -12, 10], [515, 52, 19, 20, -8],
    [690, 118, 25, -18, 14], [395, 272, -22, 10, 38], [705, 292, -21, 24, 30],
  ];
  let papers = [];

  function makePapers() {
    papersEl.innerHTML = "";
    papers = layout.map(([x, y, r, ty, tx], i) => {
      const el = document.createElement("div");
      el.className = "paper";
      el.innerHTML = docs[i]();
      papersEl.appendChild(el);
      return {
        el, x, y, r, ty, tx, baseR: r, phase: i * 1.7,
        vx: 0, vy: 0, falling: false, fallT: 0,
        swayA: rnd(28, 55), swayW: rnd(1.9, 2.8), spin: rnd(-14, 14),
      };
    });
  }

  let raf = null, t0 = 0, last = 0, rush = false;
  function frame(now) {
    const t = (now - t0) / 1000, dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    for (const p of papers) {
      let X, Y, R, TX, TY = p.ty;
      if (!p.falling) {
        X = p.x;
        Y = p.y + Math.sin(t * 1.05 + p.phase) * 5;
        R = p.r + Math.sin(t * 0.8 + p.phase) * 1.2;
        TX = p.tx + Math.sin(t * 0.9 + p.phase) * 3;
      } else {
        // falling-leaf motion: slow terminal speed + side-to-side sway that tilts the page
        p.fallT += dt;
        p.vy += 700 * dt;
        p.vy = Math.min(p.vy, rush ? 620 : 260);    // paper's slow terminal speed (faster once the scene exits)
        p.vy *= Math.pow(0.6, dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.r += p.spin * dt;
        const s = Math.sin(p.fallT * p.swayW + p.phase);
        const c = Math.cos(p.fallT * p.swayW + p.phase);
        X = p.x + s * p.swayA;
        Y = p.y - Math.abs(c) * 6;                  // slight lift at each end of a swing
        R = p.r + c * 14;                            // bank into the swing
        TX = p.tx * Math.exp(-p.fallT * .6) + s * 22;
        TY = p.ty + c * 10;
      }
      p.el.style.transform = `translate(${X}px, ${Y}px) rotate(${R}deg) rotateY(${TY}deg) rotateX(${TX}deg)`;
    }
    raf = requestAnimationFrame(frame);
  }

  function dropPapers() {
    for (const p of papers) {
      p.falling = true;
      p.fallT = 0;
      p.vy = rnd(-110, -60);                         // gentle jolt from the tap
      p.vx = (p.x + 76 - 500) * 0.08 + rnd(-12, 12); // drift slightly outward
    }
  }

  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  function setGavel(cls) {
    gavel.classList.remove("lift", "strike", "rebound", "settle");
    if (cls) gavel.classList.add(cls);
  }

  function impact() {
    stage.classList.remove("tap"); void stage.offsetWidth; stage.classList.add("tap");
    const ring = document.getElementById("ring");
    ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
    knock();
    dropPapers();
  }

  // Short wooden knock (only if the browser allows sound)
  let audio = null;
  function knock() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") return;
      const now = audio.currentTime;
      // body thump
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(190, now); o.frequency.exponentialRampToValueAtTime(70, now + .12);
      g.gain.setValueAtTime(.55, now); g.gain.exponentialRampToValueAtTime(.001, now + .22);
      o.connect(g).connect(audio.destination); o.start(now); o.stop(now + .25);
      // woody click
      const len = Math.floor(audio.sampleRate * .03), buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const n = audio.createBufferSource(), f = audio.createBiquadFilter(), ng = audio.createGain();
      n.buffer = buf; f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = 1.2; ng.gain.value = .5;
      n.connect(f).connect(ng).connect(audio.destination); n.start(now);
    } catch (e) { /* sound is optional */ }
  }

  function showFinal() {
    timers.forEach(clearTimeout); timers.length = 0;
    if (raf) cancelAnimationFrame(raf);
    papersEl.innerHTML = ""; papers = [];
    setGavel(null); contact.classList.remove("near");
    scene.classList.remove("exit"); scene.classList.add("gone");
    hero.classList.add("instant", "show", "rise", "done");
    skipBtn.classList.add("hidden");
  }

  function play() {
    timers.forEach(clearTimeout); timers.length = 0;
    if (raf) cancelAnimationFrame(raf);
    gavel.style.transition = ""; gavel.style.rotate = "";
    hero.classList.remove("instant", "show", "rise", "done");
    scene.classList.remove("exit", "gone"); rush = false;
    skipBtn.classList.remove("hidden");
    contact.classList.remove("near");
    setGavel(null);
    makePapers();
    t0 = last = performance.now();
    raf = requestAnimationFrame(frame);

    at(650, () => setGavel("lift"));                        // small wrist lift
    at(1300, () => { setGavel("strike"); contact.classList.add("near"); });
    at(1410, () => { impact(); setGavel("rebound"); });     // knock
    at(1500, () => { setGavel("settle"); contact.classList.remove("near"); });
    at(2150, () => {                                         // gavel + block sink away, papers follow
      scene.classList.add("exit"); rush = true;
      for (const p of papers) p.vy = Math.max(p.vy, 0) + rnd(140, 260);
    });
    at(3000, () => hero.classList.add("show"));             // QUBENCH appears
    at(3250, () => hero.classList.add("rise"));             // Parliament emerges from the bottom
    at(4700, () => { hero.classList.add("done"); skipBtn.classList.add("hidden"); });
    at(6500, () => { if (raf) cancelAnimationFrame(raf); papersEl.innerHTML = ""; });
  }

  document.getElementById("replay").addEventListener("click", () => {
    if (audio && audio.state === "suspended") audio.resume();
    else if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    play();
  });
  skipBtn.addEventListener("click", showFinal);
  if (reduced) showFinal(); else play();
})();
</script>
</body>
</html>
